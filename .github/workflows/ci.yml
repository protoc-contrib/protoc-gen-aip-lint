name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Dependabot bumps go.sum but not the vendorHash in flake.nix. This pushes
  # the new one with the App token, and the run that push triggers cancels
  # this one through the concurrency group above. Workflows Dependabot
  # triggers read Dependabot secrets only, so both values live there.
  hash:
    if: startsWith(github.head_ref, 'dependabot/go_modules/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Update Dependency Hash
        uses: nixos-contrib/nix-update-hash@main
        with:
          installables: .#source

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23


      - name: Run Tests
        run: |
          nix develop --command go tool ginkgo run -r \
            -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run Octocov
        uses: k1LoW/octocov-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nix_system: x86_64-linux
          - os: macos-15
            nix_system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      BIN_PATH: protoc-gen-aip-lint-${{ matrix.nix_system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Build with Nix
        run: nix build .#source --system ${{ matrix.nix_system }}

      - name: Prepare Binary
        run: install -m 0755 result/bin/protoc-gen-aip-lint "$BIN_PATH"

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.BIN_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main

  publish:
    needs: release
    if: needs.release.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download Binaries
        uses: actions/download-artifact@v8
        with:
          pattern: protoc-gen-aip-lint-*
          merge-multiple: true
          skip-decompress: true
          path: release/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: release/*

  # Pins the binaries just published in
  # .github/config/nix-release-bin-manifest.json, so the flake installs them
  # instead of building from source. The pull request is opened with the App
  # token, as one opened with GITHUB_TOKEN starts no CI.
  pin:
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Pin Release Binaries
        id: pin
        uses: nixos-contrib/nix-release-bin@main
        with:
          tag: ${{ needs.release.outputs.tag_name }}
          manifest-file: .github/config/nix-release-bin-manifest.json

      - name: Create Pull Request
        if: steps.pin.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: nix/release-binaries
          commit-message: "chore(nix): pin the ${{ steps.pin.outputs.version }} release binaries"
          title: "chore(nix): pin the ${{ steps.pin.outputs.version }} release binaries"
          labels: auto-merge
